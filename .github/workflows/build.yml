name: Build and Release

on:
  workflow_dispatch:
    inputs:
      buildType:
        description: '构建类型'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
          - dev
          - preview
          - blank-test

env:
  NODE_VERSION: 22.x
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BUILD_TYPE: ${{ github.event.inputs.buildType || 'dev' }}
      APP_VARIANT: production
      ABI_FILTERS: arm64-v8a
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 🤖 Setup PNPM
        uses: pnpm/action-setup@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install dependencies
        run: pnpm install

      - name: 🏗 Prebuild (expo -> android)
        run: cd apps/mobile && npx expo prebuild --platform android 2>&1

      - name: 📦 Bundle JS (expo export)
        run: |
          cd apps/mobile
          npx expo export --platform android 2>&1
          echo "=== dist contents ==="
          find dist -type f | head -20
          mkdir -p android/app/src/main/assets
          cp dist/index.android.js android/app/src/main/assets/index.android.bundle 2>/dev/null || \
          cp dist/android-index.android.js android/app/src/main/assets/index.android.bundle 2>/dev/null || \
          find dist -name "*.android.bundle" -exec cp {} android/app/src/main/assets/index.android.bundle \; 2>/dev/null || true
          echo "=== assets after copy ==="
          ls -la android/app/src/main/assets/ 2>/dev/null

      - name: 🚀 Build APK
        if: env.BUILD_TYPE != 'blank-test'
        run: |
          cd apps/mobile/android && ./gradlew assembleDebug 2>&1
          ARTIFACT_DIR="${RUNNER_TEMP}/bbplayer-apk"
          mkdir -p "$ARTIFACT_DIR"
          find app/build/outputs/apk -name "*.apk" -exec cp {} "$ARTIFACT_DIR/" \;
          echo "APK_DIR=$ARTIFACT_DIR" >> $GITHUB_ENV

      - name: 🚀 Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: bbplayer-${{ env.BUILD_TYPE }}
          path: ${{ env.APK_DIR }}
          if-no-files-found: error
